name: 'pxEconomy'
version: '0.1'
main: 'io.github.winnpixie.pixiecraft.economy.plugin.PxEconomyPlugin'
api-version: 26.1
depend:
  - 'pxCommons'

commands:
  economy:
    aliases: [ 'eco' ]
    description: 'Manage the economy.'
    usage: '/economy <grant|tax|balance> <user> [amount]'
  balance:
    aliases: [ 'bal' ]
    description: 'View your wallet balance.'
    usage: '/balance'
  bank:
    description: "Manage your bank accounts."
    usage: "/bank <open|close|accounts|balance|deposit|withdraw> [account] [balance]"
  pay:
    description: "Send currency to another user online."
    usage: "/pay <user> <amount>"