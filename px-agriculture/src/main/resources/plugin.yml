name: "pxAgriculture"
version: "0.1"
main: "io.github.winnpixie.pixiecraft.agriculture.plugin.PxAgriculturePlugin"
api-version: 26.3
depend:
  - "pxCommons"

commands:
  toggle-pathing:
    aliases: [ "togglepathing", "dirtpathing" ]
    description: "Toggle creating paths with a shovel"
    usage: "/toggle-pathing"
  toggle-stripping:
    aliases: [ "togglestripping", "logstripping" ]
    description: "Toggle stripping wooden logs with an axe"
    usage: "/toggle-stripping"